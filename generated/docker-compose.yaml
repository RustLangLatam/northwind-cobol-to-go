name: northwind-ibmi-cobol-legacy-application

services:
  nwc620:
    build:
      context: .
      dockerfile: deploy/nwc620/Dockerfile
    image: nwc620:1.0.0-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:50051:50051"
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700,size=64mi
      - /var/lib/nwc620/spool:uid=65532,gid=65532,mode=0700,size=128mi
    volumes:
      - ./deploy/nwc620/db2-ca:/etc/nwc620/db2-ca:ro
      - ./deploy/nwc620/tls:/etc/nwc620/tls:ro
      - ./deploy/nwc620/metrics:/etc/nwc620/metrics:ro
    env_file:
      - deploy/nwc620/secret.env
    environment:
      GRPC_HOST: "0.0.0.0"
      GRPC_PORT: "50051"
      GRPC_TLS_CERT_FILE: "/etc/nwc620/tls/tls.crt"
      GRPC_TLS_KEY_FILE: "/etc/nwc620/tls/tls.key"
      GRPC_TLS_CLIENT_CA_FILE: ""
      GRPC_ALLOW_PLAINTEXT: "false"
      GRPC_ALLOW_PLAINTEXT_REMOTE: "false"
      GRPC_AUTH_MODE: "token"
      AUTH_TOKEN_SCHEMA: "JWT"
      AUTH_TOKEN_PUBLIC_KEY: ""
      AUTH_TOKEN_ISSUER: ""
      AUTH_TOKEN_AUDIENCE: "nwc620"
      AUTH_TOKEN_ALLOW_ANY_AUDIENCE: "false"
      AUTH_TOKEN_CLOCK_SKEW: "30s"
      AUTH_TOKEN_MAX_LIFETIME: "24h"
      AUTH_TOKEN_REQUIRED_SCOPES: ""
      GRPC_MTLS_ALLOWED_CLIENTS: ""
      GRPC_DEFAULT_TIMEOUT: "30s"
      GRPC_MAX_CONCURRENT_STREAMS: "100"
      GRPC_MAX_RECV_MSG_BYTES: "4194304"
      METRICS_HOST: "0.0.0.0"
      METRICS_PORT: "9100"
      METRICS_BEARER_TOKEN_FILE: "/etc/nwc620/metrics/token"
      METRICS_ALLOW_UNAUTHENTICATED: "false"
      SHUTDOWN_TIMEOUT: "15s"
      READYZ_CACHE_TTL: "2s"
      OTEL_SERVICE_NAME: "nwc620"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_INSECURE: "false"
      SERVICE_TIME_ZONE: ""
      LOG_LEVEL: "info"
      LOG_FORMAT: "json"
      DB2_HOST: "your-db2-host"
      DB2_PORT: "9471"
      DB2_LIBRARY: "YOURLIB"
      DB2_USER: "your-user"
      DB2_COMMIT_MODE: "*NONE"
      DB2_CCSID: "SET_ME"
      DB2_MIN_PASSWORD_LEVEL: "2"
      DB2_CA_FILE: ""
      DB2_SERVER_NAME: ""
      DB2_ALLOW_PLAINTEXT: "false"
      DB2_MAX_ROWS: "10000"
      DB2_MAX_LIMIT: "100000"
      DB2_MAX_OPEN_CONNS: "5"
      DB2_MAX_IDLE_CONNS: "2"
      DB2_CONN_MAX_LIFETIME: "30m"
      DB2_CONN_MAX_IDLE_TIME: "5m"
      DB2_QUERY_TIMEOUT: "30s"
      NWC620_SPOOL_DIR: "/var/lib/nwc620/spool"
  nwc700:
    build:
      context: .
      dockerfile: deploy/nwc700/Dockerfile
    image: nwc700:1.0.0-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:50052:50052"
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700,size=64mi
      - /var/lib/nwc700/spool:uid=65532,gid=65532,mode=0700,size=128mi
    volumes:
      - ./deploy/nwc700/db2-ca:/etc/nwc700/db2-ca:ro
      - ./deploy/nwc700/tls:/etc/nwc700/tls:ro
      - ./deploy/nwc700/metrics:/etc/nwc700/metrics:ro
    env_file:
      - deploy/nwc700/secret.env
    environment:
      GRPC_HOST: "0.0.0.0"
      GRPC_PORT: "50052"
      GRPC_TLS_CERT_FILE: "/etc/nwc700/tls/tls.crt"
      GRPC_TLS_KEY_FILE: "/etc/nwc700/tls/tls.key"
      GRPC_TLS_CLIENT_CA_FILE: ""
      GRPC_ALLOW_PLAINTEXT: "false"
      GRPC_ALLOW_PLAINTEXT_REMOTE: "false"
      GRPC_AUTH_MODE: "token"
      AUTH_TOKEN_SCHEMA: "JWT"
      AUTH_TOKEN_PUBLIC_KEY: ""
      AUTH_TOKEN_ISSUER: ""
      AUTH_TOKEN_AUDIENCE: "nwc700"
      AUTH_TOKEN_ALLOW_ANY_AUDIENCE: "false"
      AUTH_TOKEN_CLOCK_SKEW: "30s"
      AUTH_TOKEN_MAX_LIFETIME: "24h"
      AUTH_TOKEN_REQUIRED_SCOPES: ""
      GRPC_MTLS_ALLOWED_CLIENTS: ""
      GRPC_DEFAULT_TIMEOUT: "30s"
      GRPC_MAX_CONCURRENT_STREAMS: "100"
      GRPC_MAX_RECV_MSG_BYTES: "4194304"
      METRICS_HOST: "0.0.0.0"
      METRICS_PORT: "9101"
      METRICS_BEARER_TOKEN_FILE: "/etc/nwc700/metrics/token"
      METRICS_ALLOW_UNAUTHENTICATED: "false"
      SHUTDOWN_TIMEOUT: "15s"
      READYZ_CACHE_TTL: "2s"
      OTEL_SERVICE_NAME: "nwc700"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_INSECURE: "false"
      SERVICE_TIME_ZONE: ""
      LOG_LEVEL: "info"
      LOG_FORMAT: "json"
      DB2_HOST: "your-db2-host"
      DB2_PORT: "9471"
      DB2_LIBRARY: "YOURLIB"
      DB2_USER: "your-user"
      DB2_COMMIT_MODE: "*NONE"
      DB2_CCSID: "SET_ME"
      DB2_MIN_PASSWORD_LEVEL: "2"
      DB2_CA_FILE: ""
      DB2_SERVER_NAME: ""
      DB2_ALLOW_PLAINTEXT: "false"
      DB2_MAX_ROWS: "10000"
      DB2_MAX_LIMIT: "100000"
      DB2_MAX_OPEN_CONNS: "5"
      DB2_MAX_IDLE_CONNS: "2"
      DB2_CONN_MAX_LIFETIME: "30m"
      DB2_CONN_MAX_IDLE_TIME: "5m"
      DB2_QUERY_TIMEOUT: "30s"
      NWC700_SPOOL_DIR: "/var/lib/nwc700/spool"
